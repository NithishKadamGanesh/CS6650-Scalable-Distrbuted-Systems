services:
  # ─── Kafka (Redpanda — Kafka-compatible, faster, single binary) ──────────
  redpanda:
    image: redpandadata/redpanda:v24.1.2
    container_name: warehouseflow-redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 3s
      retries: 5

  redpanda-console:
    image: redpandadata/console:v2.5.2
    container_name: warehouseflow-redpanda-console
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:29092
    depends_on:
      redpanda:
        condition: service_healthy

  # ─── 3 Redis instances — one per warehouse ──────────────────────────────
  redis-a:
    image: redis:7.2-alpine
    container_name: warehouseflow-redis-a
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s

  redis-b:
    image: redis:7.2-alpine
    container_name: warehouseflow-redis-b
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s

  redis-c:
    image: redis:7.2-alpine
    container_name: warehouseflow-redis-c
    ports: ["6381:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s

  # ─── Postgres audit log ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: warehouseflow-postgres
    environment:
      POSTGRES_USER: warehouseflow
      POSTGRES_PASSWORD: warehouseflow
      POSTGRES_DB: warehouseflow
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouseflow"]
      interval: 3s

  # ─── Prometheus ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: warehouseflow-prometheus
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # ─── Grafana ────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: warehouseflow-grafana
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
    depends_on:
      - prometheus

volumes:
  pgdata:
